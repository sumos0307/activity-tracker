<div class="login-page">
  <div class="login-card">
    <span class="login-badge">ACTIVITY TRACKER</span>
    <h1>Faaliyet Takip Sitesi</h1>
    <p class="subtitle">Hesabına giriş yap</p>
    <p *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </p>
    <form (ngSubmit) = "login()">
      <div class="form-group">
        <label for="email">E-posta</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="ornek@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Şifrenizi girin"
          required
        />
      </div>

      <button type="submit">
        Giriş Yap
      </button>
    </form>
    <p class="register-text">
      Hesabın yok mu?
      <a routerLink="/register">Üye Ol</a>
    </p>
    <p *ngIf="errorMessage" class="error-message">
      {{errorMessage}}
    </p>

  </div>
</div>
